[project]
name = "digestif"
version = "0.1.0"
requires-python = "==3.14.8"
dependencies = [
    "aiohttp==3.14.5",
    "resend==2.53.2",
    "beautifulsoup4==4.15.0",
    "requests==2.34.2",
    "mistralai==3.7.0",
]

[dependency-groups]
dev = [
    "ruff==0.17.4",
    "ty==0.0.101",
    "pytest==9.2.0",
    "mdformat==1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
