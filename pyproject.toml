[project]
name = "digestif"
version = "0.1.0"
requires-python = "==3.14.8"
dependencies = [
    "aiohttp==3.14.5",
    "resend==2.50.1",
    "beautifulsoup4==4.15.0",
    "requests==2.34.2",
    "mistralai==3.6.0",
    "lxml-html-clean==0.4.6",
]

[dependency-groups]
dev = [
    "ruff==0.17.3",
    "ty==0.0.95",
    "pytest==9.2.0",
    "mdformat==1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
