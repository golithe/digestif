name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lockfile:
    # Fails when actions.lock is out of sync with the workflows or a locked pin no longer verifies upstream.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1


      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format (ruff)
        run: uv run ruff format --check .

      - name: Types (ty)
        run: uv run ty check

      - name: Format (mdformat) #TODO:Find a better way to format markdown files
        run: uv run mdformat --check README.md

      - name: Tests (pytest)
        run: uv run pytest

      - name: Build container
        run: docker compose build
        env:
          TAG: ci
