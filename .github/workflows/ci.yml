name: CI

on:
  push:
    branches: [main]
  # Every base, not just main: stacked PRs target each other, and GitHub runs nothing when it retargets them.
  pull_request:

permissions:
  contents: read

jobs:
  lockfile:
    # Fails when actions.lock is out of sync with the workflows or a locked pin no longer verifies upstream.
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false


      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format (ruff)
        run: uv run ruff format --check .

      - name: Types (ty)
        run: uv run ty check

      - name: Workflow security (zizmor)
        run: uv run zizmor .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Format (mdformat) #TODO:Find a better way to format markdown files
        run: uv run mdformat --check README.md

      - name: Tests (pytest)
        run: uv run pytest

      - name: Build container
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml build
        env:
          TAG: ci
