# Published to GHCR as an OCI artifact on release; keep it free of build-only and local-file settings.
name: digestif

services:
  app:
    image: ghcr.io/golithe/digestif:${TAG:-latest}
    environment:
      - NL_RECIPIENT=${NL_RECIPIENT}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM=${RESEND_FROM}
    restart: always
